name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  # Gate: only release if CI passes
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/draft_protocol/ --ignore-missing-imports

      - name: Test
        env:
          DRAFT_DEV_MODE: "1"
        run: pytest tests/ -v --tb=short -m "not integration"

  release:
    needs: test
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
      url: https://pypi.org/project/draft-protocol/

    steps:
      # Was secrets.GH_TOKEN, a PAT created 2026-02-25 that has since expired, so
      # checkout failed with "could not read Username for https://github.com" and
      # every push to main since 2026-03-27 failed at this step. GITHUB_TOKEN is
      # minted per run, never expires, and the workflow already grants it
      # contents: write, which is all semantic-release needs to push the bump
      # commit, the tag and the GitHub Release. PyPI upload uses trusted
      # publishing via id-token: write, so it needs no token at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      # PSR determines version from commits, bumps files, updates changelog,
      # commits, tags, pushes — all automatically
      - name: Semantic Release — Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Semantic Release — GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish
